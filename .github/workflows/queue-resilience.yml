name: Queue Resilience Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  queue_resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: queue_ops
          POSTGRES_USER: queue_ops
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queue_ops -d queue_ops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://queue_ops@127.0.0.1:5432/queue_ops
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install backend dependencies
        working-directory: server
        run: npm ci
      - name: Prove 500+ queue restart and concurrency safety
        working-directory: server
        run: node test/message-queue-postgres-acceptance.mjs
