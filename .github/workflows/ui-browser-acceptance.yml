          E2E_EMAIL: browser-owner@test.invalid
          E2E_PASSWORD: BrowserOwner2026Kst9
        run: node web/e2e/supplier-catalog-import-regression.cjs
      - name: Exercise procurement replenishment planning in Chromium
        env:
