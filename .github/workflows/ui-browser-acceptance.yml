name: UI Browser Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  browser_acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser acceptance environment
        run: |
          DB_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET_VALUE=$(openssl rand -hex 32)
          cat > .env <<EOF
          POSTGRES_DB=profi24
          POSTGRES_USER=profi24
          POSTGRES_PASSWORD=$DB_PASSWORD
          JWT_SECRET=$JWT_SECRET_VALUE
          NODE_ENV=production
          CORS_ORIGIN=http://127.0.0.1:5173
          PUBLIC_BASE_URL=http://127.0.0.1:5173
          DB_POOL_MAX=10
          WEB_PORT=5173
          BACKUP_RETENTION_DAYS=14
          AUTH_RATE_LIMIT_PER_MINUTE=60
          AUTH_TOKEN_TTL=12h
          AUTH_FAILURE_LIMIT=20
          AUTH_FAILURE_WINDOW_MINUTES=10
          AUTH_LOCK_MINUTES=15
          EOF
      - name: Start full browser acceptance stack
        run: |
          docker compose up -d --build \
            db api auth warehouse procurement suppliercatalog payroll analytics finance documents notifications communications approvals workflow \
            operations performance kpi profitability pricing pricebook diagnostic knowledge parts completion reliability warranty discipline \
            ownercontrol directoryadmin ordertasks branchadmin cashregister lifecycle custody web
      - name: Wait for all proxied CRM services
        run: |
          paths=(
            /health /auth-health /warehouse-health /procurement-health /supplier-catalog-health /knowledge-health /payroll-health /analytics-health /finance-health
            /documents-health /notifications-health /communications-health /approvals-health /workflow-health /operations-health
            /performance-health /kpi-health /profitability-health /pricing-health /pricebook-health /diagnostic-health /parts-health
            /completion-health /reliability-health /warranty-health /discipline-health /owner-health /directory-health /order-tasks-health
            /branch-health /cash-health /lifecycle-health /custody-health
          )
          for i in $(seq 1 100); do
            missing=0
            for p in "${paths[@]}"; do curl -fsS "http://127.0.0.1:5173$p" >/dev/null || missing=1; done
            if [ "$missing" -eq 0 ]; then exit 0; fi
            sleep 3
          done
          docker compose ps
          docker compose logs --tail=120
          exit 1
      - name: Bootstrap browser OWNER
        run: docker compose exec -T api node src/bootstrap-owner.js browser-owner@test.invalid 'BrowserOwner2026Kst9' 'Browser Owner'
      - name: Install isolated Playwright Chromium
        run: |
          mkdir -p /tmp/profi24-playwright
          cd /tmp/profi24-playwright
          npm init -y >/dev/null
          npm install --save-exact playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise native and addon navigation in Chromium
        env:
          NODE_PATH: /tmp/profi24-playwright/node_modules
          BASE_URL: http://127.0.0.1:5173
          E2E_EMAIL: browser-owner@test.invalid
          E2E_PASSWORD: BrowserOwner2026Kst9
        run: node web/e2e/sidebar-navigation.cjs
      - name: Exercise current Order360 and six-role regression in Chromium
        env:
          NODE_PATH: /tmp/profi24-playwright/node_modules
          BASE_URL: http://127.0.0.1:5173
          E2E_EMAIL: browser-owner@test.invalid
          E2E_PASSWORD: BrowserOwner2026Kst9
        run: node web/e2e/current-order360-regression.cjs
      - name: Exercise engineer capacity dispatch in Chromium
        env:
          NODE_PATH: /tmp/profi24-playwright/node_modules
          BASE_URL: http://127.0.0.1:5173
          E2E_EMAIL: browser-owner@test.invalid
          E2E_PASSWORD: BrowserOwner2026Kst9
        run: node web/e2e/engineer-capacity-regression.cjs
      - name: Exercise complaints workflow center in Chromium
        env:
