name: UI Browser Acceptance

on:
  push:
    branches: [main, 'fix/**', 'hotfix/**']
  pull_request:
    branches: [main]

jobs:
  browser_navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser acceptance environment
        run: |
          DB_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET_VALUE=$(openssl rand -hex 32)
          cat > .env <<EOF
          POSTGRES_DB=profi24
          POSTGRES_USER=profi24
          POSTGRES_PASSWORD=$DB_PASSWORD
          JWT_SECRET=$JWT_SECRET_VALUE
          NODE_ENV=production
          CORS_ORIGIN=http://127.0.0.1:5173
          PUBLIC_BASE_URL=http://127.0.0.1:5173
          DB_POOL_MAX=10
          WEB_PORT=5173
          BACKUP_RETENTION_DAYS=14
          AUTH_RATE_LIMIT_PER_MINUTE=30
          AUTH_TOKEN_TTL=12h
          AUTH_FAILURE_LIMIT=10
          AUTH_FAILURE_WINDOW_MINUTES=10
          AUTH_LOCK_MINUTES=15
          EOF
      - name: Start browser acceptance stack
        run: docker compose up -d --build db api auth branchadmin notifications web
      - name: Wait for web, auth, branch and notifications services
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/health >/dev/null \
              && curl -fsS http://127.0.0.1:5173/auth-health >/dev/null \
              && curl -fsS http://127.0.0.1:5173/branch-health >/dev/null \
              && curl -fsS http://127.0.0.1:5173/notifications-health >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose ps
          docker compose logs --tail=150 api auth branchadmin notifications web
          exit 1
      - name: Bootstrap browser OWNER
        run: docker compose exec -T api node src/bootstrap-owner.js browser-owner@test.invalid 'BrowserOwner2026Kst9' 'Browser Owner'
      - name: Install isolated Playwright Chromium
        run: |
          mkdir -p /tmp/profi24-playwright
          cd /tmp/profi24-playwright
          npm init -y >/dev/null
          npm install --save-exact playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise real sidebar clicks in Chromium
        env:
          NODE_PATH: /tmp/profi24-playwright/node_modules
          BASE_URL: http://127.0.0.1:5173
          E2E_EMAIL: browser-owner@test.invalid
          E2E_PASSWORD: BrowserOwner2026Kst9
        run: node web/e2e/sidebar-navigation.cjs
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-browser-diagnostics
          path: web/e2e/artifacts
          if-no-files-found: ignore
      - name: Show browser stack failure logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200 api auth branchadmin notifications web
      - name: Stop browser acceptance stack
        if: always()
        run: docker compose down -v
