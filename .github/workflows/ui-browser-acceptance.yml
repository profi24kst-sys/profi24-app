        run: node web/e2e/warehouse-stock-analytics-regression.cjs
      - name: Exercise warehouse inventory reconciliation in Chromium
        env:
          NODE_PATH: /tmp/profi24-playwright/node_modules
          BASE_URL: http://127.0.0.1:5173
          E2E_EMAIL: browser-owner@test.invalid
          E2E_PASSWORD: BrowserOwner2026Kst9
        run: node web/e2e/warehouse-inventory-regression.cjs
      - name: Exercise knowledge base and diagnostic integration in Chromium
        env:
          NODE_PATH: /tmp/profi24-playwright/node_modules
          BASE_URL: http://127.0.0.1:5173
          E2E_EMAIL: browser-owner@test.invalid
          E2E_PASSWORD: BrowserOwner2026Kst9
        run: node web/e2e/knowledge-base-regression.cjs
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-browser-diagnostics
          path: web/e2e/artifacts
          if-no-files-found: ignore
      - name: Show browser stack failure logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=250
      - name: Stop browser acceptance stack
        if: always()
        run: docker compose down -v
