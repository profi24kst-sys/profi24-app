name: Final Dependency Cleanup

on:
  push:
    branches: ['feature/production-acceptance']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-acceptance
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove temporary preview job and require lockfiles in CRM CI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ci.yml')
          s=p.read_text()
          marker='  dependency_upgrade_preview:\n'
          if marker in s:
              start=s.index(marker)
              end=s.index('\n  validate:\n',start)
              s=s[:start]+s[end+1:]
          old_api="      - name: Install API dependencies\n        working-directory: server\n        run: npm install\n"
          new_api="      - name: Install API dependencies from lockfile\n        working-directory: server\n        run: npm ci\n"
          old_web="      - name: Install web dependencies\n        working-directory: web\n        run: npm install\n"
          new_web="      - name: Install web dependencies from lockfile\n        working-directory: web\n        run: npm ci\n"
          if old_api in s:
              s=s.replace(old_api,new_api,1)
          if old_web in s:
              s=s.replace(old_web,new_web,1)
          if 'dependency_upgrade_preview:' in s or 'run: npm install\n' in s:
              raise SystemExit('CRM CI cleanup incomplete')
          p.write_text(s)
          PY
      - name: Verify deterministic backend dependencies
        working-directory: server
        run: |
          npm ci
          npm audit --omit=dev --audit-level=critical
          npm ls fastify @fastify/jwt fast-jwt --depth=2
      - name: Verify deterministic frontend dependencies and build
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=critical
          npm run build
      - name: Verify production Docker build uses frontend lockfile
        run: grep -Fxq 'RUN npm ci' web/Dockerfile
      - name: Remove temporary cleanup workflow and commit final pipeline
        run: |
          rm .github/workflows/dependency-upgrade-preview.yml
          git diff --check
          git diff -- .github/workflows/ci.yml web/Dockerfile
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml .github/workflows/dependency-upgrade-preview.yml
          if git diff --cached --quiet; then
            echo 'Final dependency pipeline is already clean.'
            exit 0
          fi
          git commit -m 'ci: finalize locked dependency pipeline'
          git push origin HEAD:feature/production-acceptance
