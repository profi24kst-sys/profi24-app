name: Dependency Upgrade Preview

on:
  push:
    branches: ['feature/production-acceptance']
  pull_request:
    branches: [main, 'feature/**', 'fix/**']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Keep backend security-sensitive dependencies on audited versions
        working-directory: server
        run: npm install --save fastify@^5.12.2 @fastify/jwt@^10.2.2
      - name: Verify backend critical advisories are gone
        working-directory: server
        run: npm audit --omit=dev --audit-level=critical
      - name: Show resolved backend security-sensitive versions
        working-directory: server
        run: npm ls fastify @fastify/jwt fast-jwt --depth=2
      - name: Pin deterministic frontend dependencies and build
        working-directory: web
        run: |
          npm install --save-exact @vitejs/plugin-react@6.1.1 vite@8.2.2 lucide-react@1.41.0 react@19.2.8 react-dom@19.2.8
          npm audit --audit-level=critical
          npm run build
      - name: Upload audited manifests
        uses: actions/upload-artifact@v4
        with:
          name: audited-dependency-manifests
          path: |
            server/package.json
            server/package-lock.json
            web/package.json
            web/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Commit audited manifests back to feature branch
        if: github.event_name == 'push' && github.ref_name == 'feature/production-acceptance'
        run: |
          CHANGES=$(git status --porcelain -- server/package.json server/package-lock.json web/package.json web/package-lock.json)
          if [ -z "$CHANGES" ]; then
            echo 'Audited manifests already committed.'
            exit 0
          fi
          printf '%s\n' "$CHANGES"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/package.json server/package-lock.json web/package.json web/package-lock.json
          git commit -m 'fix: pin audited frontend dependencies'
          git push origin HEAD:feature/production-acceptance
