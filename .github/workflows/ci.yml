name: CRM CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, 'feature/**', 'fix/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        working-directory: server
        run: npm install
      - name: Validate every backend service syntax
        working-directory: server
        run: npm run check
      - name: Run auditable finance tests
        working-directory: server
        run: npm run test:finance
      - name: Run order and CRM regression tests
        working-directory: server
        run: |
          npm run test:orders
          npm run test:crm
      - name: Run business-logic unit tests (pricing guard, KPI bonus, workflow transitions)
        working-directory: server
        run: |
          npm run test:pricing-guard
          npm run test:kpi
          npm run test:workflow
      - name: Install web dependencies
        working-directory: web
        run: npm install
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Validate Docker Compose
        run: docker compose config >/dev/null
      - name: Build service images
        run: docker compose build

  smoke:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: cp .env.example .env
      - name: Start the stack
        run: docker compose up -d --build db api web
      - name: Wait for core health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:5173/health >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose ps
          docker compose logs api web
          exit 1
      - name: Create ephemeral smoke owner
        run: |
          docker compose exec -T api node --input-type=module -e "import bcrypt from 'bcryptjs';import pg from 'pg';const p=new pg.Pool({connectionString:process.env.DATABASE_URL});const h=await bcrypt.hash('profi24',10);await p.query(\"INSERT INTO users(name,email,password_hash,role,active) VALUES('Smoke Owner','owner@profi24.kz',\$1,'OWNER',true) ON CONFLICT(email) DO UPDATE SET password_hash=EXCLUDED.password_hash,role='OWNER',active=true\",[h]);await p.end();"
      - name: Verify authenticated core API
        run: |
          LOGIN=$(curl -fsS -X POST http://localhost:5173/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"owner@profi24.kz","password":"profi24"}')
          TOKEN=$(printf '%s' "$LOGIN" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.data?.access_token)process.exit(1);process.stdout.write(j.data.access_token)})")
          curl -fsS http://localhost:5173/api/v1/me -H "Authorization: Bearer $TOKEN" | grep -q OWNER
          curl -fsS http://localhost:5173/api/v1/requests -H "Authorization: Bearer $TOKEN" | grep -q '"data"'
      - name: Verify every consolidated service came up
        run: |
          for path in owner-health directory-health order-tasks-health approvals-health workflow-health operations-health performance-health kpi-health profitability-health pricing-health pricebook-health diagnostic-health parts-health completion-health reliability-health warranty-health discipline-health; do
            echo "checking /$path"
            curl -fsS "http://localhost:5173/$path" >/dev/null
          done
      - name: Verify database reachable
        run: docker compose exec -T db psql -U profi24 -d profi24 -c 'SELECT count(*) FROM requests;'
      - name: Show service status
        if: always()
        run: docker compose ps
      - name: Show failure logs
        if: failure()
        run: docker compose logs --tail=250 api web
      - name: Stop stack
        if: always()
        run: docker compose down -v
