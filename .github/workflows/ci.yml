name: CRM CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, 'feature/**', 'fix/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject unsafe production config and accept hardened config
        run: |
          set -a
          . ./.env.example
          set +a
          if sh ops/preflight.sh; then
            echo '.env.example must never pass production preflight'
            exit 1
          fi
          NODE_ENV=production \
          POSTGRES_DB=profi24 \
          POSTGRES_USER=profi24 \
          POSTGRES_PASSWORD='K9m4Z7p2N8v5Q1r6' \
          JWT_SECRET='A8f4J2k9M7q3R6t1V5x8Z2n4C7b9D1w6' \
          CORS_ORIGIN='https://crm.profi24.kz' \
          PUBLIC_BASE_URL='https://crm.profi24.kz' \
          DB_POOL_MAX=10 WEB_PORT=443 BACKUP_RETENTION_DAYS=14 \
          sh ops/preflight.sh
      - name: Install API dependencies
        working-directory: server
        run: npm install
      - name: Validate every backend service syntax
        working-directory: server
        run: npm run check
      - name: Run auditable finance tests
        working-directory: server
        run: npm run test:finance
      - name: Run order and CRM regression tests
        working-directory: server
        run: |
          npm run test:orders
          npm run test:crm
      - name: Install web dependencies
        working-directory: web
        run: npm install
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Validate Docker Compose
        run: docker compose config >/dev/null
      - name: Build all service images
        run: docker compose build

  recovery:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated recovery environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=profi24
          POSTGRES_USER=profi24
          POSTGRES_PASSWORD=CiRecoveryDb9K4m7Z2p
          JWT_SECRET=CiRecoveryJwt8N4m2Q7v5Z1r6K9p3T8x4W2
          NODE_ENV=production
          CORS_ORIGIN=http://localhost:5173
          PUBLIC_BASE_URL=http://localhost:5173
          DB_POOL_MAX=10
          WEB_PORT=5173
          BACKUP_RETENTION_DAYS=14
          EOF
      - name: Start source database and migrate CRM
        run: docker compose up -d --build db api
      - name: Wait for source API health
        run: |
          for i in $(seq 1 40); do
            if docker compose exec -T api node -e "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then exit 0; fi
            sleep 3
          done
          docker compose ps
          docker compose logs api db
          exit 1
      - name: Seed recovery marker and create backup set
        run: |
          docker compose exec -T db psql -U profi24 -d profi24 -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS recovery_drill_marker(id int PRIMARY KEY, value text NOT NULL);
          INSERT INTO recovery_drill_marker(id,value) VALUES(1,'PROFI24-RECOVERY-OK') ON CONFLICT(id) DO UPDATE SET value=EXCLUDED.value;
          SQL
          docker compose run --rm backup sh /backup.sh
          BACKUP_SET=$(docker compose run --rm backup sh -c 'ls -1dt /backups/* | head -1')
          test -n "$BACKUP_SET"
          echo "BACKUP_SET=$BACKUP_SET" >> "$GITHUB_ENV"
      - name: Restore backup into a separate empty database
        run: |
          docker compose exec -T db createdb -U profi24 profi24_restore_drill
          docker compose run --rm \
            -e RESTORE_CONFIRM=YES \
            -e RESTORE_DATABASE_URL='postgresql://profi24:CiRecoveryDb9K4m7Z2p@db:5432/profi24_restore_drill' \
            -v "$PWD/ops/restore.sh:/restore.sh:ro" \
            backup sh /restore.sh "$BACKUP_SET"
      - name: Verify restored operational data and critical tables
        run: |
          test "$(docker compose exec -T db psql -U profi24 -d profi24_restore_drill -Atqc "SELECT value FROM recovery_drill_marker WHERE id=1")" = 'PROFI24-RECOVERY-OK'
          docker compose exec -T db psql -U profi24 -d profi24_restore_drill -Atqc 'SELECT count(*) FROM users;' | grep -Eq '^[0-9]+$'
          docker compose exec -T db psql -U profi24 -d profi24_restore_drill -Atqc 'SELECT count(*) FROM requests;' | grep -Eq '^[0-9]+$'
          docker compose exec -T db psql -U profi24 -d profi24_restore_drill -Atqc 'SELECT count(*) FROM payroll_periods;' | grep -Eq '^[0-9]+$'
          docker compose exec -T db psql -U profi24 -d profi24_restore_drill -Atqc 'SELECT count(*) FROM kpi_result_snapshots;' | grep -Eq '^[0-9]+$'
      - name: Prove restore refuses a non-empty target by default
        run: |
          if docker compose run --rm \
            -e RESTORE_CONFIRM=YES \
            -e RESTORE_DATABASE_URL='postgresql://profi24:CiRecoveryDb9K4m7Z2p@db:5432/profi24_restore_drill' \
            -v "$PWD/ops/restore.sh:/restore.sh:ro" \
            backup sh /restore.sh "$BACKUP_SET"; then
            echo 'restore unexpectedly allowed a non-empty target'
            exit 1
          fi
      - name: Show recovery failure logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=150 api db
      - name: Stop recovery stack
        if: always()
        run: docker compose down -v

  smoke:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: cp .env.example .env
      - name: Start core CRM, lifecycle, payroll and KPI
        run: docker compose up -d --build db api ownercontrol lifecycle payroll kpi web
      - name: Wait for core, lifecycle, payroll and KPI health
        run: |
          for i in $(seq 1 50); do
            if curl -fsS http://localhost:5173/health >/dev/null \
              && curl -fsS http://localhost:5173/owner-health >/dev/null \
              && curl -fsS http://localhost:5173/lifecycle-health >/dev/null \
              && curl -fsS http://localhost:5173/payroll-health >/dev/null \
              && curl -fsS http://localhost:5173/kpi-health >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose ps
          docker compose logs api ownercontrol lifecycle payroll workflow kpi web
          exit 1
      - name: Create ephemeral smoke owner
        run: |
          docker compose exec -T api node --input-type=module -e "import bcrypt from 'bcryptjs';import pg from 'pg';const p=new pg.Pool({connectionString:process.env.DATABASE_URL});const h=await bcrypt.hash('profi24',10);await p.query(\"INSERT INTO users(name,email,password_hash,role,active) VALUES('Smoke Owner','owner@profi24.kz',\$1,'OWNER',true) ON CONFLICT(email) DO UPDATE SET password_hash=EXCLUDED.password_hash,role='OWNER',active=true\",[h]);await p.end();"
      - name: Verify authenticated core, lifecycle, payroll and KPI API
        run: |
          LOGIN=$(curl -fsS -X POST http://localhost:5173/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"owner@profi24.kz","password":"profi24"}')
          TOKEN=$(printf '%s' "$LOGIN" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.data?.access_token)process.exit(1);process.stdout.write(j.data.access_token)})")
          curl -fsS http://localhost:5173/api/v1/me -H "Authorization: Bearer $TOKEN" | grep -q OWNER
          curl -fsS http://localhost:5173/api/v1/requests -H "Authorization: Bearer $TOKEN" | grep -q '"data"'
          curl -fsS http://localhost:5173/owner-health | grep -q owner-control
          curl -fsS http://localhost:5173/lifecycle-health | grep -q profi24-order-lifecycle
          curl -fsS http://localhost:5173/payroll-health | grep -q profi24-payroll
          curl -fsS http://localhost:5173/kpi-health | grep -q profi24-kpi
          curl -fsS http://localhost:5173/lifecycle-api/v1/lifecycle/exceptions -H "Authorization: Bearer $TOKEN" | grep -q '"data"'
          curl -fsS http://localhost:5173/payroll-api/v1/periods -H "Authorization: Bearer $TOKEN" | grep -q '"data"'
          curl -fsS 'http://localhost:5173/kpi-api/v1/report?month=2026-09' -H "Authorization: Bearer $TOKEN" | grep -q '"data"'
      - name: Verify database reachable
        run: |
          docker compose exec -T db psql -U profi24 -d profi24 -c 'SELECT count(*) FROM requests;'
          docker compose exec -T db psql -U profi24 -d profi24 -c 'SELECT count(*) FROM payroll_periods;'
          docker compose exec -T db psql -U profi24 -d profi24 -c 'SELECT count(*) FROM kpi_result_snapshots;'
      - name: Show service status
        if: always()
        run: docker compose ps
      - name: Show failure logs
        if: failure()
        run: |
          docker compose logs --tail=150 api
          docker compose logs --tail=150 ownercontrol
          docker compose logs --tail=150 lifecycle
          docker compose logs --tail=150 payroll
          docker compose logs --tail=150 workflow
          docker compose logs --tail=150 kpi
          docker compose logs --tail=100 web
      - name: Stop stack
        if: always()
        run: docker compose down -v
