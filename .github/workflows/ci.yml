name: CRM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        working-directory: server
        run: npm install
      - name: Validate API syntax
        working-directory: server
        run: npm run check
      - name: Install web dependencies
        working-directory: web
        run: npm install
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Validate Docker Compose
        run: docker compose config >/dev/null

  smoke:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: cp .env.example .env
      - name: Build and start stack
        run: docker compose up -d --build
      - name: Wait for web health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5173/health >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose ps
          docker compose logs api
          exit 1
      - name: Verify login API
        run: |
          curl -fsS -X POST http://localhost:5173/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"owner@profi24.kz","password":"profi24"}' | grep -q access_token
      - name: Show service status
        if: always()
        run: docker compose ps
      - name: Stop stack
        if: always()
        run: docker compose down -v
