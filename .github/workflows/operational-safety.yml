name: Operational Safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  account_security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: profi24_ops
          POSTGRES_USER: profi24_ops
          POSTGRES_PASSWORD: OpsDb2026KstSafe9
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U profi24_ops -d profi24_ops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://profi24_ops:OpsDb2026KstSafe9@127.0.0.1:5432/profi24_ops
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: server
        run: npm install
      - name: Prove production check requires an OWNER
        working-directory: server
        run: |
          if npm run production-user-check; then
            echo 'production user check unexpectedly passed without an owner'
            exit 1
          fi
      - name: Bootstrap first OWNER and verify production accounts
        working-directory: server
        run: |
          npm run bootstrap-owner -- ops-owner@test.invalid 'OpsOwner2026Kst9' 'Ops Owner'
          npm run production-user-check
      - name: Prove second bootstrap and weak reset are rejected
        working-directory: server
        run: |
          if npm run bootstrap-owner -- second-owner@test.invalid 'SecondOwner2026Kst9' 'Second Owner'; then
            echo 'second OWNER bootstrap unexpectedly succeeded'
            exit 1
          fi
          if npm run set-password -- ops-owner@test.invalid 'profi24'; then
            echo 'weak password reset unexpectedly succeeded'
            exit 1
          fi
          npm run set-password -- ops-owner@test.invalid 'RotatedOwner2026Kst8'
          npm run production-user-check

  auth_security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare auth-security environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=profi24
          POSTGRES_USER=profi24
          POSTGRES_PASSWORD=AuthDb2026KstSafe9
          JWT_SECRET=AuthJwt2026KstSafeSecretValue42Q7
          NODE_ENV=production
          CORS_ORIGIN=http://localhost:5173
          PUBLIC_BASE_URL=http://localhost:5173
          DB_POOL_MAX=10
          WEB_PORT=5173
          BACKUP_RETENTION_DAYS=14
          AUTH_RATE_LIMIT_PER_MINUTE=30
          AUTH_TOKEN_TTL=12h
          AUTH_FAILURE_LIMIT=10
          AUTH_FAILURE_WINDOW_MINUTES=10
          AUTH_LOCK_MINUTES=15
          EOF
      - name: Start auth gateway through nginx
        run: docker compose up -d --build db api auth web
      - name: Wait for auth gateway health
        run: |
          for i in $(seq 1 50); do
            if curl -fsS http://localhost:5173/health >/dev/null && curl -fsS http://localhost:5173/auth-health >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose ps
          docker compose logs api auth web
          exit 1
      - name: Create strong OWNER account
        run: |
          docker compose exec -T api node src/bootstrap-owner.js auth-owner@test.invalid 'AuthOwner2026Kst9' 'Auth Owner'
      - name: Prove database-backed brute-force lockout
        run: |
          bad_login(){ curl -sS -o /tmp/auth-bad.json -w '%{http_code}' -X POST http://localhost:5173/api/v1/auth/login -H 'Content-Type: application/json' -d '{"email":"auth-owner@test.invalid","password":"WrongPassword2026"}'; }
          for i in $(seq 1 9); do
            CODE=$(bad_login)
            test "$CODE" = '401' || { echo "attempt $i expected 401, got $CODE"; cat /tmp/auth-bad.json; exit 1; }
          done
          CODE=$(bad_login)
          test "$CODE" = '429' || { echo "10th attempt expected 429, got $CODE"; cat /tmp/auth-bad.json; exit 1; }
          CODE=$(curl -sS -o /tmp/auth-locked.json -w '%{http_code}' -X POST http://localhost:5173/api/v1/auth/login -H 'Content-Type: application/json' -d '{"email":"auth-owner@test.invalid","password":"AuthOwner2026Kst9"}')
          test "$CODE" = '429' || { echo "correct password during lock expected 429, got $CODE"; cat /tmp/auth-locked.json; exit 1; }
      - name: Clear test lock and verify successful audited login
        run: |
          docker compose exec -T db psql -U profi24 -d profi24 -c "DELETE FROM auth_login_state WHERE email='auth-owner@test.invalid';"
          LOGIN=$(curl -fsS -X POST http://localhost:5173/api/v1/auth/login -H 'Content-Type: application/json' -d '{"email":"auth-owner@test.invalid","password":"AuthOwner2026Kst9"}')
          TOKEN=$(printf '%s' "$LOGIN" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).data.access_token))")
          curl -fsS 'http://localhost:5173/auth-api/v1/auth/security-events?limit=30' -H "Authorization: Bearer $TOKEN" >/tmp/security-events.json
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/security-events.json','utf8'));const rows=j.data||[];if(!rows.some(x=>x.email==='auth-owner@test.invalid'&&x.success===false)||!rows.some(x=>x.email==='auth-owner@test.invalid'&&x.success===true))process.exit(1)"
          test "$(docker compose exec -T db psql -U profi24 -d profi24 -Atqc "SELECT count(*) FROM auth_login_state WHERE email='auth-owner@test.invalid'")" = '0'
      - name: Show auth security failure logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200 api auth web
      - name: Stop auth stack
        if: always()
        run: docker compose down -v

  backup_tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create checksum-valid fake backup set
        run: |
          mkdir -p /tmp/profi24-backups/20260907-120000 /tmp/profi24-offsite
          printf 'custom-format-placeholder\n' >/tmp/profi24-backups/20260907-120000/postgres.dump
          printf 'uploads-placeholder\n' >/tmp/profi24-backups/20260907-120000/uploads.tar.gz
          cd /tmp/profi24-backups/20260907-120000
          sha256sum postgres.dump uploads.tar.gz >SHA256SUMS
      - name: Verify freshness and atomic offsite export
        run: |
          BACKUP_DIR=/tmp/profi24-backups MAX_BACKUP_AGE_HOURS=26 sh ops/backup-status.sh
          BACKUP_DIR=/tmp/profi24-backups OFFSITE_BACKUP_DIR=/tmp/profi24-offsite sh ops/export-backup.sh
          cd /tmp/profi24-offsite/20260907-120000
          sha256sum -c SHA256SUMS
      - name: Prove duplicate export and corrupted backup are rejected
        run: |
          if BACKUP_DIR=/tmp/profi24-backups OFFSITE_BACKUP_DIR=/tmp/profi24-offsite sh ops/export-backup.sh; then
            echo 'duplicate export unexpectedly succeeded'
            exit 1
          fi
          printf 'corruption\n' >>/tmp/profi24-backups/20260907-120000/postgres.dump
          if BACKUP_DIR=/tmp/profi24-backups MAX_BACKUP_AGE_HOURS=26 sh ops/backup-status.sh; then
            echo 'corrupted backup unexpectedly passed integrity check'
            exit 1
          fi

  attachment_security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare attachment-security environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=profi24
          POSTGRES_USER=profi24
          POSTGRES_PASSWORD=AttachmentDb2026Kst9
          JWT_SECRET=AttachmentJwt2026Kst9SafeSecretValue42
          NODE_ENV=production
          CORS_ORIGIN=http://localhost:5173
          PUBLIC_BASE_URL=http://localhost:5173
          DB_POOL_MAX=10
          WEB_PORT=5173
          BACKUP_RETENTION_DAYS=14
          AUTH_RATE_LIMIT_PER_MINUTE=30
          AUTH_TOKEN_TTL=12h
          EOF
      - name: Start core, auth and documents service
        run: docker compose up -d --build db api auth documents web
      - name: Wait for auth and documents health
        run: |
          for i in $(seq 1 50); do
            if curl -fsS http://localhost:5173/health >/dev/null && curl -fsS http://localhost:5173/auth-health >/dev/null && curl -fsS http://localhost:5173/documents-health >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose ps
          docker compose logs api auth documents web
          exit 1
      - name: Seed owner, mentor engineer, trainee and participant order
        run: |
          docker compose exec -T api node --input-type=module <<'NODE'
          import bcrypt from 'bcryptjs';
          import pg from 'pg';
          const p=new pg.Pool({connectionString:process.env.DATABASE_URL});
          const users=[
            ['Attachment Owner','attachment-owner@test.invalid','AttachmentOwner2026Kst9','OWNER'],
            ['Attachment Engineer','attachment-engineer@test.invalid','AttachmentEngineer2026Kst9','ENGINEER'],
            ['Attachment Trainee','attachment-trainee@test.invalid','AttachmentTrainee2026Kst9','TRAINEE']
          ];
          for(const [name,email,password,role] of users){
            const hash=await bcrypt.hash(password,10);
            await p.query('INSERT INTO users(name,email,password_hash,role,active) VALUES($1,$2,$3,$4,true)',[name,email,hash,role]);
          }
          const owner=(await p.query("SELECT id FROM users WHERE email='attachment-owner@test.invalid'")).rows[0].id;
          const engineer=(await p.query("SELECT id FROM users WHERE email='attachment-engineer@test.invalid'")).rows[0].id;
          const trainee=(await p.query("SELECT id FROM users WHERE email='attachment-trainee@test.invalid'")).rows[0].id;
          const customer=(await p.query("INSERT INTO customers(name,phone,phone_norm) VALUES('Attachment Client','70000000077','70000000077') RETURNING id")).rows[0].id;
          const request=(await p.query("INSERT INTO requests(number,customer_id,engineer_id,status,complaint,total) VALUES('FILE-SEC-1',$1,$2,'REPAIR','Attachment security',0) RETURNING id",[customer,engineer])).rows[0].id;
          await p.query('INSERT INTO user_mentors(trainee_id,mentor_id,assigned_by) VALUES($1,$2,$3)',[trainee,engineer,owner]);
          await p.query("INSERT INTO request_participants(request_id,user_id,participant_role,mentor_id,added_by) VALUES($1,$2,'TRAINEE',$3,$4)",[request,trainee,engineer,owner]);
          await p.end();
          NODE
      - name: Login test users
        run: |
          login(){ curl -fsS -X POST http://localhost:5173/api/v1/auth/login -H 'Content-Type: application/json' -d "$1" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).data.access_token))"; }
          OWNER_TOKEN=$(login '{"email":"attachment-owner@test.invalid","password":"AttachmentOwner2026Kst9"}')
          TRAINEE_TOKEN=$(login '{"email":"attachment-trainee@test.invalid","password":"AttachmentTrainee2026Kst9"}')
          ORDER_ID=$(docker compose exec -T db psql -U profi24 -d profi24 -Atqc "SELECT id FROM requests WHERE number='FILE-SEC-1'")
          test -n "$OWNER_TOKEN"
          test -n "$TRAINEE_TOKEN"
          test -n "$ORDER_ID"
          {
            echo "OWNER_TOKEN=$OWNER_TOKEN"
            echo "TRAINEE_TOKEN=$TRAINEE_TOKEN"
            echo "ORDER_ID=$ORDER_ID"
          } >> "$GITHUB_ENV"
      - name: Accept a real JPEG and return hardened download headers
        run: |
          JPEG_B64=$(printf '\377\330\377\340\000\000\000\000' | base64 -w0)
          RESPONSE=$(curl -fsS -X POST "http://localhost:5173/documents-api/v1/requests/$ORDER_ID/files" \
            -H "Authorization: Bearer $OWNER_TOKEN" -H 'Content-Type: application/json' \
            -d "{\"name\":\"defect.jpg\",\"kind\":\"DEFECT_PHOTO\",\"data\":\"data:image/jpeg;base64,$JPEG_B64\"}")
          FILE_ID=$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).data.id)))")
          echo "FILE_ID=$FILE_ID" >> "$GITHUB_ENV"
          curl -fsS -D /tmp/file-headers -o /tmp/file-body "http://localhost:5173/documents-api/v1/files/$FILE_ID" -H "Authorization: Bearer $OWNER_TOKEN"
          grep -Eqi '^content-type: image/jpeg' /tmp/file-headers
          grep -Eqi '^x-content-type-options: nosniff' /tmp/file-headers
          grep -Eqi '^content-disposition: attachment;' /tmp/file-headers
      - name: Reject HTML, SVG and MIME spoofing
        run: |
          expect_reject(){
            CODE=$(curl -sS -o /tmp/reject.json -w '%{http_code}' -X POST "http://localhost:5173/documents-api/v1/requests/$ORDER_ID/files" -H "Authorization: Bearer $OWNER_TOKEN" -H 'Content-Type: application/json' -d "$1")
            test "$CODE" = '422'
          }
          HTML=$(printf '<html><script>alert(1)</script></html>' | base64 -w0)
          SVG=$(printf '<svg xmlns="http://www.w3.org/2000/svg"><script>alert(1)</script></svg>' | base64 -w0)
          JPEG=$(printf '\377\330\377\340\000\000\000\000' | base64 -w0)
          expect_reject "{\"name\":\"payload.html\",\"kind\":\"OTHER\",\"data\":\"data:text/html;base64,$HTML\"}"
          expect_reject "{\"name\":\"payload.svg\",\"kind\":\"OTHER\",\"data\":\"data:image/svg+xml;base64,$SVG\"}"
          expect_reject "{\"name\":\"spoof.jpg\",\"kind\":\"OTHER\",\"data\":\"data:text/html;base64,$JPEG\"}"
      - name: Prove trainee attachment access is append-only
        run: |
          JPEG_B64=$(printf '\377\330\377\340\000\000\000\000' | base64 -w0)
          curl -fsS -X POST "http://localhost:5173/documents-api/v1/requests/$ORDER_ID/files" \
            -H "Authorization: Bearer $TRAINEE_TOKEN" -H 'Content-Type: application/json' \
            -d "{\"name\":\"trainee.jpg\",\"kind\":\"DEFECT_PHOTO\",\"data\":\"data:image/jpeg;base64,$JPEG_B64\"}" >/dev/null
          CODE=$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE "http://localhost:5173/documents-api/v1/files/$FILE_ID" -H "Authorization: Bearer $TRAINEE_TOKEN")
          test "$CODE" = '403'
          CODE=$(curl -sS -o /tmp/signature.json -w '%{http_code}' -X POST "http://localhost:5173/documents-api/v1/requests/$ORDER_ID/signatures" -H "Authorization: Bearer $TRAINEE_TOKEN" -H 'Content-Type: application/json' -d "{\"signer_type\":\"CLIENT\",\"signature_data\":\"data:image/jpeg;base64,$JPEG_B64\"}")
          test "$CODE" = '403'
      - name: Show attachment failure logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=180 api auth documents web
      - name: Stop attachment stack
        if: always()
        run: docker compose down -v
