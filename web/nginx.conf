server {
 listen 80; server_name _; root /usr/share/nginx/html; index index.html; client_max_body_size 12m;
 location /api/ { proxy_pass http://api:8080/api/; }
 location /warehouse-api/ { proxy_pass http://warehouse:8081/api/; }
 location /procurement-api/ { proxy_pass http://procurement:8082/api/; }
 location /payroll-api/ { proxy_pass http://payroll:8083/api/; }
 location /analytics-api/ { proxy_pass http://analytics:8084/api/; }
 location /finance-api/ { proxy_pass http://finance:8085/api/; }
 location /documents-api/ { proxy_pass http://documents:8086/api/; }
 location /notifications-api/ { proxy_pass http://notifications:8087/api/; }
 location /communications-api/ { proxy_pass http://communications:8088/api/; }
 location /approvals-api/ { proxy_pass http://approvals:8089/; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
 location /workflow-api/ { proxy_pass http://workflow:8090/api/; }
 location /operations-api/ { proxy_pass http://operations:8091/api/; }
 location /performance-api/ { proxy_pass http://performance:8092/api/; }
 location /kpi-api/ { proxy_pass http://kpi:8093/api/; }
 location /profitability-api/ { proxy_pass http://profitability:8094/api/; }
 location /approve/ { try_files $uri /approve.html; }
 location /health { proxy_pass http://api:8080/health; }
 location /approvals-health { proxy_pass http://approvals:8089/health; }
 location /workflow-health { proxy_pass http://workflow:8090/health; }
 location /operations-health { proxy_pass http://operations:8091/health; }
 location /performance-health { proxy_pass http://performance:8092/health; }
 location /kpi-health { proxy_pass http://kpi:8093/health; }
 location /profitability-health { proxy_pass http://profitability:8094/health; }
 location / { try_files $uri /index.html; }
}
