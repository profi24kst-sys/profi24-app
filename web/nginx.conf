server {
 listen 80; server_name _; root /usr/share/nginx/html; index index.html; client_max_body_size 12m;
 resolver 127.0.0.11 valid=10s ipv6=off;
 add_header X-Content-Type-Options "nosniff" always;
 add_header X-Frame-Options "DENY" always;
 add_header Referrer-Policy "no-referrer" always;
 add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_set_header X-Forwarded-Host $host;
 set $auth http://auth:8109;
 location = /api/v1/auth/login { proxy_pass $auth; }
 location /auth-api/ { rewrite ^/auth-api/(.*)$ /api/$1 break; proxy_pass $auth; }
 location /api/ { proxy_pass http://api:8080/api/; }
 set $warehouse http://warehouse:8081; set $procurement http://procurement:8082; set $payroll http://payroll:8083;
 set $analytics http://analytics:8084; set $finance http://finance:8085; set $documents http://documents:8086;
 set $notifications http://notifications:8087; set $communications http://communications:8088; set $approvals http://approvals:8089;
 set $workflow http://workflow:8090; set $operations http://operations:8091; set $performance http://performance:8092;
 set $kpi http://kpi:8093; set $profitability http://profitability:8094; set $pricing http://pricing:8095;
 set $pricebook http://pricebook:8096; set $diagnostic http://diagnostic:8097; set $parts http://parts:8098;
 set $completion http://completion:8099; set $reliability http://reliability:8100; set $warranty http://warranty:8101;
 set $discipline http://discipline:8102; set $ownercontrol http://ownercontrol:8103; set $directoryadmin http://directoryadmin:8104; set $ordertasks http://ordertasks:8105; set $branchadmin http://branchadmin:8106; set $cashregister http://cashregister:8107; set $lifecycle http://lifecycle:8108; set $custody http://custody:8110; set $suppliercatalog http://suppliercatalog:8111; set $knowledge http://knowledge:8112;
 location /warehouse-api/ { rewrite ^/warehouse-api/(.*)$ /api/$1 break; proxy_pass $warehouse; }
 location /procurement-api/ { rewrite ^/procurement-api/(.*)$ /api/$1 break; proxy_pass $procurement; }
 location /supplier-catalog-api/ { rewrite ^/supplier-catalog-api/(.*)$ /api/$1 break; proxy_pass $suppliercatalog; }
 location /knowledge-api/ { rewrite ^/knowledge-api/(.*)$ /api/$1 break; proxy_pass $knowledge; }
 location /payroll-api/ { rewrite ^/payroll-api/(.*)$ /api/$1 break; proxy_pass $payroll; }
 location /analytics-api/ { rewrite ^/analytics-api/(.*)$ /api/$1 break; proxy_pass $analytics; }
 location /finance-api/ { rewrite ^/finance-api/(.*)$ /api/$1 break; proxy_pass $finance; }
 location /documents-api/ { rewrite ^/documents-api/(.*)$ /api/$1 break; proxy_pass $documents; }
 location /notifications-api/ { rewrite ^/notifications-api/(.*)$ /api/$1 break; proxy_pass $notifications; }
 location /communications-api/ { rewrite ^/communications-api/(.*)$ /api/$1 break; proxy_pass $communications; }
 location /feedback-api/ { rewrite ^/feedback-api/(.*)$ /public/$1 break; proxy_pass $communications; }
 location /approvals-api/ { rewrite ^/approvals-api/(.*)$ /$1 break; proxy_pass $approvals; }
 location /workflow-api/ { rewrite ^/workflow-api/(.*)$ /api/$1 break; proxy_pass $workflow; }
 location /operations-api/ { rewrite ^/operations-api/(.*)$ /api/$1 break; proxy_pass $operations; }
 location /performance-api/ { rewrite ^/performance-api/(.*)$ /api/$1 break; proxy_pass $performance; }
 location /kpi-api/ { rewrite ^/kpi-api/(.*)$ /api/$1 break; proxy_pass $kpi; }
 location /profitability-api/ { rewrite ^/profitability-api/(.*)$ /api/$1 break; proxy_pass $profitability; }
 location /pricing-api/ { rewrite ^/pricing-api/(.*)$ /api/$1 break; proxy_pass $pricing; }
 location /pricebook-api/ { rewrite ^/pricebook-api/(.*)$ /api/$1 break; proxy_pass $pricebook; }
 location /diagnostic-api/ { rewrite ^/diagnostic-api/(.*)$ /api/$1 break; proxy_pass $diagnostic; }
 location /parts-api/ { rewrite ^/parts-api/(.*)$ /api/$1 break; proxy_pass $parts; }
 location /completion-api/ { rewrite ^/completion-api/(.*)$ /api/$1 break; proxy_pass $completion; }
 location /reliability-api/ { rewrite ^/reliability-api/(.*)$ /api/$1 break; proxy_pass $reliability; }
 location /warranty-api/ { rewrite ^/warranty-api/(.*)$ /$1 break; proxy_pass $warranty; }
 location /discipline-api/ { rewrite ^/discipline-api/(.*)$ /api/$1 break; proxy_pass $discipline; }
 location /owner-api/ { rewrite ^/owner-api/(.*)$ /api/$1 break; proxy_pass $ownercontrol; }
 location /directory-api/ { rewrite ^/directory-api/(.*)$ /api/$1 break; proxy_pass $directoryadmin; }
 location /order-tasks-api/ { rewrite ^/order-tasks-api/(.*)$ /api/$1 break; proxy_pass $ordertasks; }
 location /branch-api/ { rewrite ^/branch-api/(.*)$ /api/$1 break; proxy_pass $branchadmin; }
 location /cash-api/ { rewrite ^/cash-api/(.*)$ /api/$1 break; proxy_pass $cashregister; }
 location /lifecycle-api/ { rewrite ^/lifecycle-api/(.*)$ /api/$1 break; proxy_pass $lifecycle; }
 location /custody-api/ { rewrite ^/custody-api/(.*)$ /api/$1 break; proxy_pass $custody; }
 location /approve/ { try_files $uri /approve.html; }
 location /warranty/ { try_files $uri /warranty.html; }
 location /feedback/ { try_files $uri /feedback.html; }
 location /health { proxy_pass http://api:8080/health; }
 location /auth-health { proxy_pass $auth/health; }
 location /warehouse-health { proxy_pass $warehouse/health; }
 location /procurement-health { proxy_pass $procurement/health; }
 location /supplier-catalog-health { proxy_pass $suppliercatalog/health; }
 location /knowledge-health { proxy_pass $knowledge/health; }
 location /payroll-health { proxy_pass $payroll/health; }
 location /analytics-health { proxy_pass $analytics/health; }
 location /finance-health { proxy_pass $finance/health; }
 location /documents-health { proxy_pass $documents/health; }
 location /notifications-health { proxy_pass $notifications/health; }
 location /communications-health { proxy_pass $communications/health; }
 location /owner-health { proxy_pass $ownercontrol/health; }
 location /directory-health { proxy_pass $directoryadmin/health; }
 location /order-tasks-health { proxy_pass $ordertasks/health; }
 location /branch-health { proxy_pass $branchadmin/health; }
 location /cash-health { proxy_pass $cashregister/health; }
 location /lifecycle-health { proxy_pass $lifecycle/health; }
 location /custody-health { proxy_pass $custody/health; }
 location /approvals-health { proxy_pass $approvals/health; }
 location /workflow-health { proxy_pass $workflow/health; }
 location /operations-health { proxy_pass $operations/health; }
 location /performance-health { proxy_pass $performance/health; }
 location /kpi-health { proxy_pass $kpi/health; }
 location /profitability-health { proxy_pass $profitability/health; }
 location /pricing-health { proxy_pass $pricing/health; }
 location /pricebook-health { proxy_pass $pricebook/health; }
 location /diagnostic-health { proxy_pass $diagnostic/health; }
 location /parts-health { proxy_pass $parts/health; }
 location /completion-health { proxy_pass $completion/health; }
 location /reliability-health { proxy_pass $reliability/health; }
 location /warranty-health { proxy_pass $warranty/health; }
 location /discipline-health { proxy_pass $discipline/health; }
 location / { try_files $uri /index.html; }
}