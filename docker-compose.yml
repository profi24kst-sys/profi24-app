services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    environment: {POSTGRES_DB: "${POSTGRES_DB:-profi24}", POSTGRES_USER: "${POSTGRES_USER:-profi24}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-profi24-change-me}"}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-profi24} -d ${POSTGRES_DB:-profi24}"], interval: 5s, timeout: 5s, retries: 10}
  # Every backend module used to be its own container (25 of them) even
  # though none of them ever called each other over HTTP - they only share
  # Postgres. server/src/all.js starts them all, unchanged, in one process;
  # each still binds its own historical port (see web/nginx.conf), so this
  # single container replaces api/warehouse/procurement/payroll/analytics/
  # finance/documents/notifications/communications/approvals/workflow/
  # operations/performance/kpi/profitability/pricing/pricebook/diagnostic/
  # parts/completion/reliability/warranty/discipline/ownercontrol/
  # directoryadmin/ordertasks from the previous docker-compose.yml.
  api:
    build: ./server
    restart: unless-stopped
    environment: {NODE_ENV: "${NODE_ENV:-production}", DATABASE_URL: "postgresql://${POSTGRES_USER:-profi24}:${POSTGRES_PASSWORD:-profi24-change-me}@db:5432/${POSTGRES_DB:-profi24}", JWT_SECRET: "${JWT_SECRET:-change-me-in-production}", CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5173}", PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:5173}", DB_POOL_MAX: "${DB_POOL_MAX:-3}", TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}", WHATSAPP_TOKEN: "${WHATSAPP_TOKEN:-}", WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}", WHATSAPP_API_VERSION: "${WHATSAPP_API_VERSION:-v23.0}", PORT: 8080, UPLOAD_DIR: /data/uploads}
    volumes: [uploads:/data/uploads]
    depends_on: {db: {condition: service_healthy}}
    healthcheck: {test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""], interval: 10s, timeout: 5s, retries: 10, start_period: 15s}
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-profi24}:${POSTGRES_PASSWORD:-profi24-change-me}@db:5432/${POSTGRES_DB:-profi24}"
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
    volumes: [./ops/backup.sh:/backup.sh:ro, backups:/backups, uploads:/data/uploads:ro]
    depends_on: {api: {condition: service_healthy}}
    command: ["sh","-c","while true; do sh /backup.sh; sleep 86400; done"]
  web:
    build: ./web
    restart: unless-stopped
    ports: ["${WEB_PORT:-5173}:80"]
    # Core CRM must remain available even when an optional module is unhealthy.
    depends_on: {api: {condition: service_healthy}}
volumes: {pgdata: {}, uploads: {}, backups: {}}
