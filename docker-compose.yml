services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: {POSTGRES_DB: "${POSTGRES_DB:-profi24}", POSTGRES_USER: "${POSTGRES_USER:-profi24}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-profi24-change-me}"}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-profi24} -d ${POSTGRES_DB:-profi24}"], interval: 5s, timeout: 5s, retries: 10}
  api:
    build: ./server
    restart: unless-stopped
    environment: &env {NODE_ENV: "${NODE_ENV:-production}", DATABASE_URL: "postgresql://${POSTGRES_USER:-profi24}:${POSTGRES_PASSWORD:-profi24-change-me}@db:5432/${POSTGRES_DB:-profi24}", JWT_SECRET: "${JWT_SECRET:-change-me-in-production}", CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5173}", DB_POOL_MAX: "${DB_POOL_MAX:-10}", TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}", WHATSAPP_TOKEN: "${WHATSAPP_TOKEN:-}", WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}", WHATSAPP_API_VERSION: "${WHATSAPP_API_VERSION:-v23.0}", PORT: 8080}
    depends_on: {db: {condition: service_healthy}}
    healthcheck: &hc {test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""], interval: 10s, timeout: 5s, retries: 10, start_period: 10s}
  warehouse: {build: ./server, restart: unless-stopped, command: ["node","src/warehouse.js"], environment: {<<: *env, PORT: 8081}, depends_on: {db: {condition: service_healthy}}, healthcheck: *hc}
  procurement: {build: ./server, restart: unless-stopped, command: ["node","src/procurement.js"], environment: {<<: *env, PORT: 8082}, depends_on: {db: {condition: service_healthy}}, healthcheck: *hc}
  payroll: {build: ./server, restart: unless-stopped, command: ["node","src/payroll.js"], environment: {<<: *env, PORT: 8083}, depends_on: {db: {condition: service_healthy}}, healthcheck: *hc}
  analytics: {build: ./server, restart: unless-stopped, command: ["node","src/analytics.js"], environment: {<<: *env, PORT: 8084}, depends_on: {db: {condition: service_healthy}}, healthcheck: *hc}
  finance: {build: ./server, restart: unless-stopped, command: ["node","src/finance.js"], environment: {<<: *env, PORT: 8085}, depends_on: {db: {condition: service_healthy}}, healthcheck: *hc}
  documents: {build: ./server, restart: unless-stopped, command: ["node","src/documents.js"], environment: {<<: *env, PORT: 8086, UPLOAD_DIR: /data/uploads}, volumes: [uploads:/data/uploads], depends_on: {db: {condition: service_healthy}}, healthcheck: *hc}
  notifications: {build: ./server, restart: unless-stopped, command: ["node","src/notifications.js"], environment: {<<: *env, PORT: 8087}, depends_on: {db: {condition: service_healthy}}, healthcheck: *hc}
  communications: {build: ./server, restart: unless-stopped, command: ["node","src/communications.js"], environment: {<<: *env, PORT: 8088}, depends_on: {db: {condition: service_healthy}}, healthcheck: *hc}
  approvals: {build: ./server, restart: unless-stopped, command: ["node","src/approvals-portal.js"], environment: {<<: *env, PORT: 8089}, depends_on: {db: {condition: service_healthy}}, healthcheck: *hc}
  workflow: {build: ./server, restart: unless-stopped, command: ["node","src/workflow.js"], environment: {<<: *env, PORT: 8090}, depends_on: {db: {condition: service_healthy}}, healthcheck: *hc}
  operations: {build: ./server, restart: unless-stopped, command: ["node","src/operations-center.js"], environment: {<<: *env, PORT: 8091}, depends_on: {db: {condition: service_healthy}, workflow: {condition: service_healthy}, approvals: {condition: service_healthy}}, healthcheck: *hc}
  performance: {build: ./server, restart: unless-stopped, command: ["node","src/engineer-performance.js"], environment: {<<: *env, PORT: 8092}, depends_on: {db: {condition: service_healthy}, workflow: {condition: service_healthy}}, healthcheck: *hc}
  kpi: {build: ./server, restart: unless-stopped, command: ["node","src/kpi.js"], environment: {<<: *env, PORT: 8093}, depends_on: {db: {condition: service_healthy}, workflow: {condition: service_healthy}}, healthcheck: *hc}
  web:
    build: ./web
    restart: unless-stopped
    ports: ["${WEB_PORT:-5173}:80"]
    depends_on: {api: {condition: service_healthy}, warehouse: {condition: service_healthy}, procurement: {condition: service_healthy}, payroll: {condition: service_healthy}, analytics: {condition: service_healthy}, finance: {condition: service_healthy}, documents: {condition: service_healthy}, notifications: {condition: service_healthy}, communications: {condition: service_healthy}, approvals: {condition: service_healthy}, workflow: {condition: service_healthy}, operations: {condition: service_healthy}, performance: {condition: service_healthy}, kpi: {condition: service_healthy}}
volumes: {pgdata: {}, uploads: {}}
