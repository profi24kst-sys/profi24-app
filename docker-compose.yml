services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-profi24}
      POSTGRES_USER: ${POSTGRES_USER:-profi24}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-profi24}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-profi24}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-profi24}:${POSTGRES_PASSWORD:-profi24}@db:5432/${POSTGRES_DB:-profi24}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
