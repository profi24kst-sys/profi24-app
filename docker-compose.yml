services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-profi24}
      POSTGRES_USER: ${POSTGRES_USER:-profi24}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-profi24-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-profi24} -d ${POSTGRES_DB:-profi24}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./server
    restart: unless-stopped
    environment: &env
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-profi24}:${POSTGRES_PASSWORD:-profi24-change-me}@db:5432/${POSTGRES_DB:-profi24}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      PORT: 8080
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  warehouse:
    build: ./server
    restart: unless-stopped
    command: ["node", "src/warehouse.js"]
    environment:
      <<: *env
      PORT: 8081
    depends_on:
      db: {condition: service_healthy}
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8081/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  procurement:
    build: ./server
    restart: unless-stopped
    command: ["node", "src/procurement.js"]
    environment:
      <<: *env
      PORT: 8082
    depends_on:
      db: {condition: service_healthy}
      warehouse: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8082/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  payroll:
    build: ./server
    restart: unless-stopped
    command: ["node", "src/payroll.js"]
    environment:
      <<: *env
      PORT: 8083
    depends_on:
      db: {condition: service_healthy}
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8083/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  analytics:
    build: ./server
    restart: unless-stopped
    command: ["node", "src/analytics.js"]
    environment:
      <<: *env
      PORT: 8084
    depends_on:
      db: {condition: service_healthy}
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8084/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  finance:
    build: ./server
    restart: unless-stopped
    command: ["node", "src/finance.js"]
    environment:
      <<: *env
      PORT: 8085
    depends_on:
      db: {condition: service_healthy}
      api: {condition: service_healthy}
      payroll: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8085/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  documents:
    build: ./server
    restart: unless-stopped
    command: ["node", "src/documents.js"]
    environment:
      <<: *env
      PORT: 8086
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on:
      db: {condition: service_healthy}
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8086/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  notifications:
    build: ./server
    restart: unless-stopped
    command: ["node", "src/notifications.js"]
    environment:
      <<: *env
      PORT: 8087
    depends_on:
      db: {condition: service_healthy}
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8087/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  web:
    build: ./web
    restart: unless-stopped
    ports: ["${WEB_PORT:-5173}:80"]
    depends_on:
      api: {condition: service_healthy}
      warehouse: {condition: service_healthy}
      procurement: {condition: service_healthy}
      payroll: {condition: service_healthy}
      analytics: {condition: service_healthy}
      finance: {condition: service_healthy}
      documents: {condition: service_healthy}
      notifications: {condition: service_healthy}
volumes:
  pgdata:
  uploads:
